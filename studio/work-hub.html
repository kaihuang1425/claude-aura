<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title></title>
<link rel="stylesheet" href="session-board.css?v=1">
</head>
<body>
<main data-session-board-root data-session-board-mode="compact"></main>
<script src="locales/en.js?v=1"></script>
<script src="locales/hi.js?v=1"></script>
<script src="locales/es.js?v=1"></script>
<script src="locales/fr.js?v=1"></script>
<script src="locales/id.js?v=1"></script>
<script src="locales/ja.js?v=1"></script>
<script src="locales/ko.js?v=1"></script>
<script src="locales/pt-BR.js?v=1"></script>
<script src="locales/de.js?v=1"></script>
<script src="locales/it.js?v=1"></script>
<script src="locales/vi.js?v=1"></script>
<script src="locales/pl.js?v=1"></script>
<script src="locales/tr.js?v=1"></script>
<script src="locales/zh-CN.js?v=1"></script>
<script src="locales/zh-HKTW.js?v=1"></script>
<script src="generated-themes.js?v=1"></script>
<script src="session-board-presentation.js?v=1"></script>
<script src="session-board.js?v=1"></script>
<script>
(() => {
  "use strict";
  const bridge = window.chrome?.webview ?? null;
  const colorScheme = window.matchMedia?.("(prefers-color-scheme: dark)") ?? null;
  const presenter = window.CLAUDE_AURA_SESSION_BOARD_PRESENTATION?.createSessionBoardPresentation?.({
    document,
    strings: window.CLAUDE_AURA_STRINGS ?? Object.create(null),
    themes: window.CLAUDE_AURA_THEMES ?? Object.create(null),
    prefersDark: () => colorScheme?.matches === true,
  });
  colorScheme?.addEventListener?.("change", () => presenter?.refreshSystemAppearance?.());
  let controller = null;
  const ensureController = () => {
    if (controller || !presenter) return controller;
    controller = window.CLAUDE_AURA_SESSION_BOARD?.createSessionBoard?.({
      root: document.querySelector("[data-session-board-root]"),
      t: presenter.t,
      send: (message) => {
        if (!bridge || !message) return false;
        bridge.postMessage(message);
        return true;
      },
    }) ?? null;
    controller?.ensure?.();
    return controller;
  };
  bridge?.addEventListener("message", (event) => {
    if (presenter?.receive?.(event.data)) {
      ensureController()?.render?.();
      return;
    }
    controller?.receive?.(event.data);
  });
})();
</script>
</body>
</html>
