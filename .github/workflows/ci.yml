name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provide Windows host probe compatibility on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          command -v pwsh
          mkdir -p "$RUNNER_TEMP/aura-bin" "$RUNNER_TEMP/localappdata" "$RUNNER_TEMP/appdata"
          printf '#!/bin/sh\nexec pwsh "$@"\n' > "$RUNNER_TEMP/aura-bin/powershell.exe"
          chmod +x "$RUNNER_TEMP/aura-bin/powershell.exe"
          echo "$RUNNER_TEMP/aura-bin" >> "$GITHUB_PATH"
          echo "LOCALAPPDATA=$RUNNER_TEMP/localappdata" >> "$GITHUB_ENV"
          echo "APPDATA=$RUNNER_TEMP/appdata" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run studio:build
      - run: npm run check
