<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Continue your work card illustration</title>
  <desc id="desc">Decorative continue your work illustration showing an open planner notebook with checked tasks, a pencil, and soft kawaii accents on a transparent background.</desc>
  <defs>
    <style>
      .rose-strong { fill: #EC7F95; }
      .rose { fill: #F69AAA; }
      .rose-soft { fill: #F7BBC6; }
      .rose-faint { fill: #FCE5EA; }
      .lav { fill: #A79BE8; }
      .lav-soft { fill: #D8D1F7; }
      .apricot { fill: #F4A25D; }
      .apricot-soft { fill: #F7C797; }
      .ivory { fill: #FFF8F4; }
      .paper { fill: #FFFCFA; }
      .cocoa { fill: #3B2925; }
      .outline-rose { stroke: #EFB4C0; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fine { stroke: #F5CCD5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fine-lav { stroke: #D8D1F7; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .shadow { fill: #E6DADF; opacity: 0.22; }
    </style>
    <symbol id="continue-your-work-card-illustration" viewBox="0 0 512 512">
      <!-- ambient idea dots / hearts -->
      <g opacity="0.92">
        <path class="rose" d="M 140 250 C 140 243 145 238 151 238 C 156 238 160 241 163 245 C 166 241 170 238 175 238 C 181 238 186 243 186 250 C 186 255 181 260 175 266 L 163 277 L 151 266 C 145 260 140 255 140 250 Z" opacity="0.55"/>
        <path class="lav" d="M 122 320 L 127 331 L 138 336 L 127 341 L 122 352 L 117 341 L 106 336 L 117 331 Z" opacity="0.76"/>
        <path class="apricot" d="M 193 274 L 196 281 L 203 284 L 196 287 L 193 294 L 190 287 L 183 284 L 190 281 Z" opacity="0.85"/>
        <circle cx="163" cy="306" r="6" class="rose-soft" opacity="0.75"/>
      </g>

      <!-- small progress tabs behind book -->
      <g transform="translate(272 208) rotate(-7)">
        <rect x="0" y="0" width="80" height="60" rx="14" class="paper" stroke="#F2CDD6" stroke-width="4"/>
        <path d="M 17 20 H 54" stroke="#D8D1F7" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M 17 35 H 49" stroke="#F7BBC6" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="59" cy="20" r="6" class="rose" opacity="0.6"/>
      </g>
      <g transform="translate(334 246) rotate(9)">
        <rect x="0" y="0" width="68" height="50" rx="12" class="paper" stroke="#F2CDD6" stroke-width="4"/>
        <path d="M 15 18 H 47" stroke="#F7BBC6" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M 15 31 H 41" stroke="#D8D1F7" stroke-width="5" stroke-linecap="round" fill="none"/>
      </g>

      <!-- notebook shadow -->
      <g transform="translate(214 250) rotate(6)">
        <path d="M 8 50 C 8 24 28 4 54 4 H 196 C 222 4 242 24 242 50 V 194 C 242 220 222 240 196 240 H 54 C 28 240 8 220 8 194 Z" class="shadow"/>
      </g>

      <!-- open notebook -->
      <g transform="translate(206 238) rotate(6)">
        <path d="M 0 44 C 0 20 18 2 42 2 H 204 C 228 2 246 20 246 44 V 190 C 246 214 228 232 204 232 H 42 C 18 232 0 214 0 190 Z" class="ivory" stroke="#EFB4C0" stroke-width="5"/>
        <path d="M 123 14 V 220" class="outline-rose" opacity="0.55"/>
        <path d="M 18 44 C 18 28 30 16 46 16 H 123 V 220 H 46 C 30 220 18 208 18 192 Z" class="paper" stroke="#F3D5DB" stroke-width="3"/>
        <path d="M 123 16 H 200 C 216 16 228 28 228 44 V 192 C 228 208 216 220 200 220 H 123 Z" class="paper" stroke="#F3D5DB" stroke-width="3"/>

        <!-- binding rings -->
        <g>
          <circle cx="123" cy="42" r="8" class="rose-soft"/>
          <circle cx="123" cy="86" r="8" class="rose-soft"/>
          <circle cx="123" cy="130" r="8" class="rose-soft"/>
          <circle cx="123" cy="174" r="8" class="rose-soft"/>
        </g>

        <!-- left page content -->
        <path d="M 34 48 H 94" class="fine"/>
        <path d="M 34 68 H 84" class="fine-lav"/>
        <path d="M 34 94 H 94" class="fine"/>
        <path d="M 34 114 H 88" class="fine-lav"/>
        <path d="M 34 140 H 96" class="fine"/>
        <path d="M 34 160 H 80" class="fine-lav"/>

        <!-- right page checklist -->
        <g transform="translate(140 50)">
          <rect x="0" y="0" width="14" height="14" rx="4" class="rose-faint" stroke="#F2CDD6" stroke-width="2.5"/>
          <path d="M 4 7 L 7 10 L 11 4" stroke="#EC7F95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M 24 7 H 72" stroke="#F7BBC6" stroke-width="5" stroke-linecap="round" fill="none"/>

          <rect x="0" y="34" width="14" height="14" rx="4" class="rose-faint" stroke="#F2CDD6" stroke-width="2.5"/>
          <path d="M 4 41 L 7 44 L 11 38" stroke="#EC7F95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M 24 41 H 66" stroke="#D8D1F7" stroke-width="5" stroke-linecap="round" fill="none"/>

          <rect x="0" y="68" width="14" height="14" rx="4" class="rose-faint" stroke="#F2CDD6" stroke-width="2.5"/>
          <path d="M 24 75 H 70" stroke="#F7BBC6" stroke-width="5" stroke-linecap="round" fill="none"/>

          <rect x="0" y="102" width="14" height="14" rx="4" class="rose-faint" stroke="#F2CDD6" stroke-width="2.5"/>
          <path d="M 24 109 H 60" stroke="#D8D1F7" stroke-width="5" stroke-linecap="round" fill="none"/>
        </g>

        <!-- bookmark tab -->
        <path d="M 206 18 H 223 C 226 18 228 20 228 23 V 52 L 217 44 L 206 52 V 23 C 206 20 208 18 211 18 Z" class="lav" opacity="0.85"/>
      </g>

      <!-- pencil -->
      <g transform="translate(378 354) rotate(34)">
        <rect x="0" y="0" width="118" height="18" rx="9" class="apricot" stroke="#E6A061" stroke-width="4"/>
        <rect x="8" y="0" width="12" height="18" rx="5" class="rose-soft"/>
        <rect x="20" y="0" width="8" height="18" class="apricot-soft" opacity="0.95"/>
        <path d="M 118 0 L 142 9 L 118 18 Z" fill="#F6D8C3" stroke="#E8BFA2" stroke-width="4" stroke-linejoin="round"/>
        <path d="M 136 9 L 145 9" stroke="#3B2925" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- extra corner motifs -->
      <g opacity="0.88">
        <path class="rose-faint" d="M 384 202 C 392 194 401 190 410 190 C 419 190 428 194 436 202 C 428 210 419 214 410 214 C 401 214 392 210 384 202 Z"/>
        <path class="lav" d="M 424 308 L 430 322 L 444 328 L 430 334 L 424 348 L 418 334 L 404 328 L 418 322 Z" opacity="0.7"/>
        <path class="rose" d="M 430 250 C 430 243 435 238 441 238 C 446 238 450 241 453 245 C 456 241 460 238 465 238 C 471 238 476 243 476 250 C 476 255 471 260 465 266 L 453 277 L 441 266 C 435 260 430 255 430 250 Z" opacity="0.54"/>
      </g>

      <!-- ground flourish -->
      <path d="M 250 452 C 287 446 322 444 356 444 C 393 444 425 447 458 455" class="fine" opacity="0.85"/>
    </symbol>
  </defs>
  <use href="#continue-your-work-card-illustration"/>
</svg>
