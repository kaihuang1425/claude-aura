<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Analyze and understand card illustration</title>
  <desc id="desc">Decorative analytics illustration showing a kawaii dashboard report, bar and line charts, a magnifying glass, and soft sparkles on a transparent background.</desc>
  <defs>
    <style>
      .rose-strong { fill: #EC7F95; }
      .rose { fill: #F69AAA; }
      .rose-soft { fill: #F7BBC6; }
      .rose-faint { fill: #FCE5EA; }
      .lav { fill: #A79BE8; }
      .lav-soft { fill: #D8D1F7; }
      .apricot { fill: #F4A25D; }
      .apricot-soft { fill: #F8C895; }
      .ivory { fill: #FFF8F4; }
      .paper { fill: #FFFCFA; }
      .cocoa { fill: #3B2925; }
      .outline-rose { stroke: #EFB4C0; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fine { stroke: #F5CCD5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fine-lav { stroke: #D8D1F7; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fine-cocoa { stroke: #806F6B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .shadow { fill: #DCCFD5; opacity: 0.24; }
    </style>
    <symbol id="analyze-understand-card-illustration" viewBox="0 0 512 512">
      <!-- ambient motifs -->
      <g opacity="0.9">
        <path class="lav" d="M 144 256 L 150 270 L 164 276 L 150 282 L 144 296 L 138 282 L 124 276 L 138 270 Z" opacity="0.72"/>
        <path class="apricot" d="M 190 229 L 194 238 L 203 242 L 194 246 L 190 255 L 186 246 L 177 242 L 186 238 Z" opacity="0.9"/>
        <path class="rose" d="M 126 324 C 126 317 131 312 138 312 C 143 312 147 315 150 319 C 153 315 157 312 162 312 C 169 312 174 317 174 324 C 174 330 169 335 162 341 L 150 352 L 138 341 C 131 335 126 330 126 324 Z" opacity="0.48"/>
        <circle cx="183" cy="299" r="5" class="rose-soft" opacity="0.72"/>
      </g>

      <!-- floating metric cards -->
      <g transform="translate(284 200) rotate(-8)">
        <rect x="0" y="0" width="88" height="64" rx="16" class="paper" stroke="#F2CDD6" stroke-width="4"/>
        <circle cx="22" cy="22" r="9" class="rose" opacity="0.72"/>
        <path d="M 42 20 H 67" stroke="#F7BBC6" stroke-width="5" stroke-linecap="round"/>
        <path d="M 18 45 C 29 37 39 39 48 47 C 57 55 66 53 74 40" class="fine-lav"/>
      </g>
      <g transform="translate(364 247) rotate(8)">
        <rect x="0" y="0" width="76" height="58" rx="14" class="paper" stroke="#F2CDD6" stroke-width="4"/>
        <path d="M 17 41 V 25" stroke="#F69AAA" stroke-width="9" stroke-linecap="round"/>
        <path d="M 36 41 V 16" stroke="#A79BE8" stroke-width="9" stroke-linecap="round"/>
        <path d="M 55 41 V 29" stroke="#F4A25D" stroke-width="9" stroke-linecap="round"/>
      </g>

      <!-- report shadow -->
      <g transform="translate(213 242) rotate(5)">
        <rect x="12" y="18" width="224" height="212" rx="28" class="shadow"/>
      </g>

      <!-- main analytics report -->
      <g transform="translate(205 228) rotate(5)">
        <rect x="0" y="0" width="226" height="214" rx="28" class="ivory" stroke="#EFB4C0" stroke-width="5"/>
        <rect x="18" y="18" width="190" height="178" rx="20" class="paper" stroke="#F2D5DB" stroke-width="3"/>

        <!-- header -->
        <circle cx="38" cy="39" r="8" class="rose" opacity="0.75"/>
        <path d="M 56 37 H 116" stroke="#F7BBC6" stroke-width="6" stroke-linecap="round"/>
        <path d="M 56 50 H 98" stroke="#D8D1F7" stroke-width="4" stroke-linecap="round"/>
        <rect x="155" y="29" width="36" height="22" rx="11" class="rose-faint"/>
        <circle cx="174" cy="40" r="5" class="rose"/>

        <!-- left chart panel -->
        <rect x="31" y="72" width="91" height="103" rx="15" fill="#FFF8F4" stroke="#F4D8DE" stroke-width="3"/>
        <path d="M 48 151 V 121" stroke="#F69AAA" stroke-width="12" stroke-linecap="round"/>
        <path d="M 73 151 V 102" stroke="#A79BE8" stroke-width="12" stroke-linecap="round"/>
        <path d="M 98 151 V 130" stroke="#F4A25D" stroke-width="12" stroke-linecap="round"/>
        <path d="M 43 89 H 103" class="fine"/>

        <!-- right chart panel -->
        <rect x="134" y="72" width="61" height="103" rx="15" fill="#FFF8F4" stroke="#F4D8DE" stroke-width="3"/>
        <circle cx="165" cy="113" r="24" fill="none" stroke="#F7BBC6" stroke-width="12"/>
        <path d="M 165 89 A 24 24 0 0 1 188 118" fill="none" stroke="#A79BE8" stroke-width="12" stroke-linecap="round"/>
        <circle cx="165" cy="113" r="7" class="ivory"/>
        <path d="M 146 155 H 184" class="fine-lav"/>
      </g>

      <!-- magnifying glass -->
      <g transform="translate(326 338) rotate(-18)">
        <circle cx="46" cy="46" r="43" class="paper" stroke="#EC7F95" stroke-width="8"/>
        <circle cx="46" cy="46" r="29" fill="#FFF7F3" stroke="#F7BBC6" stroke-width="4"/>
        <path d="M 76 76 L 137 137" stroke="#EC7F95" stroke-width="18" stroke-linecap="round"/>
        <path d="M 86 86 L 126 126" stroke="#F7BBC6" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
        <circle cx="32" cy="31" r="7" fill="#FFFFFF" opacity="0.7"/>
        <path d="M 30 55 C 39 45 49 41 59 42 C 67 42 75 45 82 51" class="fine-lav"/>
      </g>

      <!-- trend line detail in front -->
      <g transform="translate(250 392)">
        <path d="M 0 39 C 22 30 38 31 54 40 C 68 48 86 43 100 27 C 114 11 129 11 147 18" class="outline-rose" opacity="0.82"/>
        <circle cx="3" cy="39" r="6" class="rose"/>
        <circle cx="53" cy="40" r="6" class="lav"/>
        <circle cx="100" cy="27" r="6" class="apricot"/>
        <circle cx="147" cy="18" r="6" class="rose-strong"/>
      </g>

      <!-- additional sparkles -->
      <g opacity="0.9">
        <path class="rose" d="M 424 185 L 430 199 L 444 205 L 430 211 L 424 225 L 418 211 L 404 205 L 418 199 Z" opacity="0.62"/>
        <path class="lav" d="M 452 315 L 456 324 L 465 328 L 456 332 L 452 341 L 448 332 L 439 328 L 448 324 Z" opacity="0.75"/>
        <path class="rose-faint" d="M 397 276 C 405 268 414 264 423 264 C 432 264 441 268 449 276 C 441 284 432 288 423 288 C 414 288 405 284 397 276 Z"/>
      </g>

      <!-- base flourish -->
      <path d="M 242 460 C 284 452 326 449 365 450 C 404 450 439 454 468 462" class="fine" opacity="0.86"/>
    </symbol>
  </defs>
  <use href="#analyze-understand-card-illustration"/>
</svg>
