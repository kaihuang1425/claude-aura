        <path class="rose" d="M 22 46 C 22 39 27 34 34 34 C 39 34 43 37 46 41 C 49 37 53 34 58 34 C 65 34 70 39 70 46 C 70 52 65 57 58 63 L 46 74 L 34 63 C 27 57 22 52 22 46 Z" opacity="0.58"/>
