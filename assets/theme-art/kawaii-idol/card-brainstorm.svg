      <g opacity="0.92">
        <path class="lav" d="M 330 156 L 336 170 L 350 176 L 336 182 L 330 196 L 324 182 L 310 176 L 324 170 Z"/>
        <path class="rose" d="M 388 178 C 394 168 402 163 412 163 C 422 163 431 168 436 178 C 441 168 450 163 460 163 C 471 163 480 171 480 182 C 480 193 472 202 462 209 C 451 217 444 224 436 235 C 428 224 420 217 409 209 C 399 202 391 193 391 182 C 391 180 391 179 388 178 Z" opacity="0.42"/>
        <path class="apricot" d="M 219 197 L 223 206 L 232 210 L 223 214 L 219 223 L 215 214 L 206 210 L 215 206 Z"/>
        <path class="rose-faint" d="M 422 286 C 431 276 440 271 451 271 C 462 271 472 276 480 286 C 472 295 462 300 451 300 C 440 300 431 295 422 286 Z"/>
