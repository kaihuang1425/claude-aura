      <g transform="translate(222 266) rotate(-5)">
        <rect x="0" y="0" width="84" height="66" rx="15" class="ivory" stroke="#F2CDD6" stroke-width="4"/>
        <path class="rose-soft" d="M 16 20 H 60" stroke="#F7BBC6" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path class="lav-soft" d="M 16 34 H 48" stroke="#D8D1F7" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="63" cy="47" r="8" class="rose" opacity="0.55"/>
