        <path d="M 63 18 C 78 2 99 -6 121 -6 C 147 -6 171 5 186 24 C 201 42 208 66 205 91 C 201 116 188 136 169 150 C 154 161 138 167 121 168 C 98 169 77 162 60 148 C 41 132 28 108 24 84 C 20 60 27 35 43 18 C 49 11 56 5 63 18 Z" class="rose-strong"/>
        <path d="M 62 28 C 78 12 97 6 120 6 C 142 6 162 14 177 29 C 191 43 198 61 196 82 C 193 103 182 121 166 133 C 153 143 138 148 121 149 C 102 150 85 145 71 135 C 55 123 45 107 41 88 C 36 68 40 48 50 34 C 54 29 58 25 62 28 Z" class="ivory"/>
