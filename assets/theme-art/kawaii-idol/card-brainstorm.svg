        <path d="M -10 8 C -3 2 3 2 10 8 C 14 12 14 20 10 24 C 3 30 -3 30 -10 24 C -14 20 -14 12 -10 8 Z" class="rose"/>
        <path d="M -5 24 C -9 37 -14 47 -19 58 C -10 54 -3 54 4 58 C 1 47 -1 37 -5 24 Z" class="rose-soft"/>
        <path d="M 5 24 C 9 37 14 47 19 58 C 10 54 3 54 -4 58 C -1 47 1 37 5 24 Z" class="rose-soft"/>
