<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Brainstorm card illustration</title>
  <desc id="desc">Decorative brainstorm illustration showing a kawaii idol-style microphone with sparkles, petals, and idea accents on a transparent background.</desc>
  <defs>
    <style>
      .rose-strong { fill: #EC7F95; }
      .rose { fill: #F69AAA; }
      .rose-soft { fill: #F7BBC6; }
      .rose-faint { fill: #FCE5EA; }
      .lav { fill: #A79BE8; }
      .lav-soft { fill: #D8D1F7; }
      .apricot { fill: #F4A25D; }
      .ivory { fill: #FFF8F4; }
      .cocoa { fill: #3B2925; }
      .outline { stroke: #EFB4C0; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fine { stroke: #F5CCD5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .shadow { fill: #EAC7CF; opacity: 0.22; }
    </style>
    <symbol id="brainstorm-card-illustration" viewBox="0 0 512 512">
      <!-- airy ambient motifs in safe lower-right zone -->
      <g opacity="0.9">
        <path class="fine" d="M 115 306 C 124 296 136 291 148 291 C 160 291 171 296 180 306" />
        <path class="fine" d="M 132 292 C 135 286 140 282 146 282 C 151 282 156 286 158 292" />
      </g>

      <!-- floating note / sparkle cloud -->
      <g transform="translate(112 246)">
        <path class="rose" d="M 0 0 C 0 -7 5 -12 12 -12 C 17 -12 22 -9 25 -4 C 28 -9 33 -12 38 -12 C 45 -12 50 -7 50 0 C 50 7 45 12 38 18 L 25 29 L 12 18 C 5 12 0 7 0 0 Z" opacity="0.55"/>
        <path class="lav" d="M 72 -12 L 77 -1 L 88 4 L 77 9 L 72 20 L 67 9 L 56 4 L 67 -1 Z" opacity="0.82"/>
        <path class="apricot" d="M 28 36 L 31 43 L 38 46 L 31 49 L 28 56 L 25 49 L 18 46 L 25 43 Z" opacity="0.88"/>
        <path class="rose-strong" d="M 102 18 C 102 11 107 6 114 6 C 119 6 123 9 126 13 C 129 9 133 6 138 6 C 145 6 150 11 150 18 C 150 24 145 29 138 35 L 126 46 L 114 35 C 107 29 102 24 102 18 Z" opacity="0.72"/>
      </g>

